[workspace]
resolver = "2"
members = [
    "crates/disk-cleaner-engine",
    "crates/disk-cleaner-cli",
    "src-tauri",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
authors = ["Disk Cleaner"]

[workspace.dependencies]
disk-cleaner-engine = { path = "crates/disk-cleaner-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.33"
dirs = "6"
regex = "1"
which = "7"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tracing = "0.1"
